task: classification

data:
  parsing_mode: default
  train_path: data/classification/train.csv
  test_path: data/classification/test.csv
  submission_template_path: data/classification/gender_submission.csv
  target: Survived
  id_column: PassengerId

features:
  # Стартовый набор: Pclass — категория, не непрерывная величина.
  numeric: [Age, SibSp, Parch, Fare]
  categorical: [Pclass, Sex, Embarked]
  # Это упрощение baseline, не вывод о бесполезности этих полей.
  drop: [Name, Ticket, Cabin]

feature_engineering:
  simple_features: false  # --simple-features добавляет FamilySize внутри Pipeline.

preprocessing:
  numeric_imputation: median
  # Baseline не меняем; эксперимент включается отдельным CLI-флагом.
  numeric_missing_indicators: false

model:
  name: logistic_regression
  target_transform: none
  params:
    C: 1.0
    solver: lbfgs
    max_iter: 2000

# Дополнительный baseline выбирается через --model; параметры не наследуются
# от LogisticRegression. target_transform остаётся none.
baseline_models:
  # Фиксированный CPU baseline; общий OneHot, без early stopping на outer-valid.
  catboost:
    iterations: 200
    learning_rate: 0.05
    depth: 6
    l2_leaf_reg: 3.0
    loss_function: Logloss
    random_seed: 42
    thread_count: 2
    task_type: CPU
    use_best_model: false
    allow_writing_files: false
    verbose: false
  lightgbm:
    n_estimators: 200
    learning_rate: 0.05
    num_leaves: 15
    max_depth: 6
    min_child_samples: 20
    reg_lambda: 1.0
    objective: binary
    random_state: 42
    n_jobs: 2
    deterministic: true
    force_col_wise: true
    verbosity: -1
  xgboost:
    n_estimators: 200
    learning_rate: 0.05
    max_depth: 4
    reg_lambda: 1.0
    subsample: 1.0
    colsample_bytree: 1.0
    objective: binary:logistic
    eval_metric: logloss
    tree_method: hist
    device: cpu
    random_state: 42
    n_jobs: 2
  stacking:
    inner_splits: 3
    random_state: 42
    meta_regularization: 1.0  # C метамодели LogisticRegression.
  torch_mlp:
    hidden_sizes: [64, 32]
    dropout: 0.1
    learning_rate: 0.001
    weight_decay: 0.0001
    batch_size: 64
    max_epochs: 150
    patience: 15
    min_delta: 0.0001
    random_state: 42
  dummy_classifier:
    strategy: prior
  random_forest:
    n_estimators: 200
    min_samples_leaf: 2
    max_features: sqrt
    n_jobs: 2
    random_state: 42
  gradient_boosting:
    n_estimators: 150
    learning_rate: 0.05
    max_depth: 3
    min_samples_leaf: 5
    random_state: 42
  hist_gradient_boosting:
    max_iter: 150
    learning_rate: 0.05
    max_leaf_nodes: 15
    min_samples_leaf: 20
    l2_regularization: 1.0
    early_stopping: false
    random_state: 42

training:
  prediction_threshold: 0.5

metric:
  name: accuracy
  direction: maximize

validation:
  strategy: stratified_kfold
  n_splits: 5
  shuffle: true
  random_state: 42
  folds_path: artifacts/classification/folds.csv

output:
  artifacts_dir: artifacts/classification
  experiments_path: results/classification_experiments.csv
  submission_path: submissions/classification_submission.csv
